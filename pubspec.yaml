name: flutter_animations_demo
description: >
  A Flutter demo showcasing both explicit animations (AnimationController + AnimatedWidget)
  and implicit animations (AnimatedContainer) on a single page.
  Group 20k-1069 | Abdul Hadi

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
